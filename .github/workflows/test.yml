name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: pytest -q
      - run: plantmr validate --exposure examples/synthetic/exposure.tsv --outcome examples/synthetic/outcome.tsv --metadata examples/synthetic/metadata.json
