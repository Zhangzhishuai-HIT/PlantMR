[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-mr"
version = "2.0.0.dev0"
description = "Plant-native Mendelian randomization and causal genomics toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "matplotlib>=3.7", "networkx>=3.0", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=8"]
research = ["statsmodels>=0.14", "scikit-learn>=1.2", "psutil>=5.9"]

[project.scripts]
plantmr = "plant_mr.cli:main"
plantmr2 = "plant_mr.platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
